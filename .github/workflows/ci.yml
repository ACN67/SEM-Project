name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK fonts for chart rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install contract and unit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/tests/contract/requirements.txt -r backend/tests/unit/requirements.txt
      - name: Static checks
        run: python -m ruff check --select E9,F63,F7,F82 backend scripts
      - name: Contract schema check
        run: python scripts/export_contracts.py --check
      - name: Contract tests
        run: python -m unittest discover -s backend/tests/contract -v
      - name: Unit tests
        run: python -m unittest discover -s backend/tests/unit -v
      - name: MySQL orchestration integration tests
        env:
          W1_MYSQL_PORT: "3306"
        run: python -m unittest backend.tests.integration.test_orchestration_mysql -v
